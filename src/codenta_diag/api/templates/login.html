{% extends "base.html" %}
{% block content %}
<h2>Reviewer sign-in (prototype)</h2>
<p class="muted">Dev key: <code>dev-reviewer</code>. Production design uses SSO (OIDC) with role and practice claims.</p>
{% if error %}<p style="color:#a00">{{ error }}</p>{% endif %}
<form method="post" action="/dashboard/login">
  <input name="api_key" type="password" placeholder="API key" autofocus>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
